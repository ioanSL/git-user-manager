name: release

# On a v* tag: build static binaries, tarballs and .debs for all architectures,
# refresh the Homebrew formula, attach everything to a GitHub Release, and (if a
# tap token is configured) push the formula to the Homebrew tap.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - name: Build binaries, tarballs, .debs (amd64 + arm64) and checksums
        run: packaging/release.sh

      - name: Refresh Homebrew formula for this tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/homebrew/update-sha.sh "${GITHUB_REPOSITORY_OWNER}" "$VERSION"
          cp packaging/homebrew/git-user-manager.rb dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/git-user-manager.rb

      - name: Push formula to Homebrew tap
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping tap push."
            echo "The refreshed formula is attached to the release instead."
            exit 0
          fi
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp packaging/homebrew/git-user-manager.rb tap/Formula/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/git-user-manager.rb
          git commit -m "git-user-manager ${GITHUB_REF_NAME}" || { echo "formula unchanged"; exit 0; }
          git push

      - name: Upload artifacts (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

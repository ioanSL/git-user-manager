[package]
name = "git-user-manager"
version = "0.1.0"
edition = "2021"
description = "Manage multiple git identities (GitHub/GitLab users) with auto-switching by remote"
license = "MIT"

[[bin]]
name = "gum"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
anyhow = "1"
ratatui = "0.29"

[profile.release]
strip = true
lto = true
